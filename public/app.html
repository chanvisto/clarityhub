<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClarityHub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F5;--s:#fff;--l:#D5E0DB;--t:#10201F;--m:#4A615C;--a:#0F6F61;--e:#A85200;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A1E;--s:#15272C;--l:#25403F;--t:#E8F1EE;--m:#9DB5B0;--a:#7FD1C0;--e:#F2B65B;--on:#0D1A1E}}
:root[data-theme="dark"]{--bg:#0D1A1E;--s:#15272C;--l:#25403F;--t:#E8F1EE;--m:#9DB5B0;--a:#7FD1C0;--e:#F2B65B;--on:#0D1A1E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:600}h2{font-size:15px;color:var(--m);font-weight:600;margin:0 0 10px}
.card{background:var(--s);border:1px solid var(--l);border-radius:20px;padding:20px;margin:0 0 14px}
.m{color:var(--m)}.big{font-size:56px;font-weight:800;line-height:1}
button,select,textarea{font:inherit;color:var(--t)}
.b{min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--a);background:transparent;color:var(--a);font-weight:600;cursor:pointer}
.p{background:var(--a);color:var(--on);border-color:var(--a)}.w{background:var(--e);color:var(--on);border-color:var(--e);font-weight:800}
.b:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.bars{display:flex;align-items:flex-end;gap:3px;height:64px}.bars i{flex:1;border-radius:3px;min-height:6px;background:var(--l)}
.c{background:var(--a)!important}.x{background:var(--e)!important}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--m);font-weight:600;cursor:pointer}
nav button[aria-current=page]{color:var(--a);box-shadow:inset 0 3px 0 var(--a)}
.chip{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--l);background:var(--s);cursor:pointer;font-weight:600}
.chip[aria-pressed=true]{background:var(--a);color:var(--on);border-color:var(--a)}
textarea,select{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--l);background:var(--bg);margin:6px 0 12px}
#ov{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
#ov.on{display:flex}
.orb{width:220px;height:220px;border-radius:50%;background:var(--a);opacity:.85;transform:scale(.6);margin:24px}
.alert{border:2px solid var(--e);border-radius:14px;padding:14px;margin:0 0 14px}
.jr{border-top:1px solid var(--l);padding:12px 0}
</style></head><body>
<main id="v"></main>
<nav id="nv" aria-label="Sections"></nav>
<div id="ov" role="dialog" aria-modal="true"></div>
<script>
const K='clarityhub1';let S={days:{},ev:[],jn:[],focus:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const TR=['Bored','Stressed','Tired','Lonely','Anxious'];
const CRISIS=/(kill myself|suicid|end it all|self.?harm|hurt myself|don.?t want to live)/i;
let tab='today',tm=null,fs={left:1500,run:false,mode:'focus'},ft=null,wipe=false,exp='',crisis=false;
const logEv=(type,tr)=>{S.ev.push({t:Date.now(),type,tr:tr||''});save()};
function score(){let c=0,n=0,b=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const v=S.days[dk(d)];if(v==='clear')c++;if(v)n++;b.push(v||'')}return{p:n?Math.round(c/n*100):null,n,b}}
function mark(v){S.days[dk()]=v;save();render()}
function nav(t){tab=t;wipe=false;exp='';render()}
function render(){
 const T=[['today','Today'],['insights','Insights'],['focus','Focus'],['journal','Journal']];
 $('#nv').innerHTML=T.map(([k,n])=>`<button onclick="nav('${k}')" ${k===tab?'aria-current="page"':''}>${n}</button>`).join('');
 $('#v').innerHTML=({today,insights,focus,journal})[tab]();
}
function today(){
 const s=score(),wk=S.ev.filter(e=>e.type==='surf'&&Date.now()-e.t<6048e5).length,td=S.days[dk()];
 return `<p class="m" style="margin:0">ClarityHub</p><h1>${s.p===null?'Start with one honest day.':'Consistency beats streaks.'}</h1>
 <div class="card"><h2>Last 30 days</h2><div class="big">${s.p===null?'&ndash;':s.p+'%'}<span class="m" style="font-size:16px;font-weight:400"> clear days${s.n?` of ${s.n} logged`:''}</span></div>
 <div class="bars" style="margin:16px 0" aria-hidden="true">${s.b.map(v=>`<i class="${v==='clear'?'c':v==='lapse'?'x':''}" style="height:${v?'100':'20'}%"></i>`).join('')}</div>
 <p class="m" style="margin:0 0 14px;font-size:14px">A lapse is one dip, never a reset to zero.</p>
 <div class="row"><button class="b ${td==='clear'?'p':''}" onclick="mark('clear')">Today was clear</button><button class="b" onclick="mark('lapse')">I had a lapse</button></div></div>
 <div class="card" style="text-align:center"><h2>Feeling an urge right now?</h2><button class="b w" style="min-height:72px;width:100%;font-size:20px" onclick="surf()">Ride the urge &middot; 3 min</button>
 <p class="m" style="margin:12px 0 0">${wk} urge${wk===1?'':'s'} ridden out this week.</p></div>
 <div class="card"><h2>Site blocker preview</h2><p class="m" style="margin-top:0">The browser extension shows this pause whenever a blocked site opens.</p><button class="b" onclick="fr()">Preview the pause screen</button></div>
 <p class="m" style="font-size:13px">Not a medical service. Synced privately to your account.</p><div class="row"><button class="b" onclick="out()">Sign out</button></div>`}
function insights(){
 const u=S.ev.filter(e=>e.type==='urge'),h=Array(24).fill(0),tc={};
 u.forEach(e=>{h[new Date(e.t).getHours()]++;if(e.tr)tc[e.tr]=(tc[e.tr]||0)+1});
 if(u.length<3)return `<h1>Patterns</h1><div class="card"><p>Log at least 3 urges (through the pause screen or Journal) and your patterns appear here. Insights are computed on your device.</p><p class="m">Urges logged: ${u.length}</p></div>`;
 const mx=Math.max(...h),pk=h.indexOf(mx),top=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
 const f=x=>(x%12||12)+(x<12?' am':' pm');
 return `<h1>Patterns</h1><div class="card"><h2>Insight</h2><p style="font-size:22px;margin:0">Urges peak around <b style="color:var(--e)">${f(pk)}</b>${top[0]?`, most often when you feel <b style="color:var(--e)">${esc(top[0][0].toLowerCase())}</b>`:''}.</p><p class="m">Plan something offline just before that hour.</p></div>
 <div class="card"><h2>Urges by hour</h2><div class="bars">${h.map(n=>`<i class="${n===mx?'x':'c'}" style="height:${Math.max(n/mx*100,6)}%"></i>`).join('')}</div><div class="m row" style="justify-content:space-between;font-size:12px"><span>12 am</span><span>12 pm</span><span>11 pm</span></div></div>
 <div class="card"><h2>Triggers</h2>${top.map(([k,n])=>`<div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b>${n}</b></div>`).join('')||'<span class="m">No triggers tagged yet.</span>'}</div>`}
function focus(){
 const m=String(Math.floor(fs.left/60)).padStart(2,'0'),s=String(fs.left%60).padStart(2,'0');
 return `<h1>Deep work</h1><div class="card" style="text-align:center"><h2 id="fm">${fs.mode==='focus'?'Focus':'Break'}</h2><div class="big" id="tm" role="timer">${m}:${s}</div>
 <div class="row" style="justify-content:center;margin-top:18px"><button class="b p" onclick="ftog()">${fs.run?'Pause':'Start'}</button><button class="b" onclick="freset()">Reset</button></div>
 <p class="m">Focus sessions completed: <b>${S.focus}</b></p></div>
 <div class="card"><h2>After a session, go offline</h2><p style="margin:0">Walk for 10 minutes, read a few pages, or write three lines in your journal.</p></div>`}
function ftog(){if(fs.run){clearInterval(ft);fs.run=false}else{fs.run=true;ft=setInterval(()=>{fs.left--;if(fs.left<=0){if(fs.mode==='focus'){S.focus++;S.ev.push({t:Date.now(),type:'focus',tr:''});save();fs={left:300,run:true,mode:'break'}}else fs={left:1500,run:true,mode:'focus'}}
 if(tab==='focus')render()},1000)}render()}
function freset(){clearInterval(ft);fs={left:1500,run:false,mode:'focus'};render()}
let jm='',jt='';
function journal(){
 const L=S.jn.slice().reverse();
 return `<h1>Journal</h1>${crisis?`<div class="alert" role="alert"><b>You matter, and you don&rsquo;t have to carry this alone.</b><br>In the US, call or text <b>988</b>. Elsewhere, find a local line at findahelpline.com.</div>`:''}
 <div class="card"><label for="jt">What triggered it?</label><select id="jt">${['',...TR].map(t=>`<option>${t}</option>`).join('')}</select>
 <label for="jx">Notes (private to your account)</label><textarea id="jx" rows="3"></textarea><button class="b p" onclick="jsave()">Save entry</button></div>
 <div class="card"><h2>Entries</h2>${L.length?L.map(e=>`<div class="jr"><span class="m" style="font-size:13px">${new Date(e.t).toLocaleString()}${e.tr?' &middot; '+esc(e.tr):''}</span><p style="margin:4px 0 8px;white-space:pre-wrap">${esc(e.x)}</p><button class="b" style="min-height:40px" onclick="jdel(${e.t})">Delete</button></div>`).join(''):'<span class="m">Nothing yet.</span>'}</div>
 <div class="card"><h2>Your data</h2><div class="row"><button class="b" onclick="exp=JSON.stringify(S,null,1);render()">Export (copy text)</button><button class="b ${wipe?'w':''}" onclick="dwipe()">${wipe?'Tap again to delete everything':'Delete all data'}</button><button class="b" onclick="delacct()">Delete account</button></div>${exp?`<textarea rows="6" readonly aria-label="Exported data">${esc(exp)}</textarea>`:''}</div>`}
function jsave(){const x=$('#jx').value.trim(),tr=$('#jt').value;if(!x&&!tr)return;
 crisis=CRISIS.test(x);S.jn.push({t:Date.now(),x,tr});if(tr)logEv('urge',tr);save();render()}
function jdel(t){S.jn=S.jn.filter(e=>e.t!==t);save();render()}
function dwipe(){if(!wipe){wipe=true;return render()}S={days:{},ev:[],jn:[],focus:0};save();wipe=false;crisis=false;exp='';render()}
function ov(h){$('#ov').innerHTML=h;$('#ov').classList.add('on')}
function closeOv(){clearInterval(tm);$('#ov').classList.remove('on');render()}
function surf(){
 let t=0,L=180;ov(`<h1 id="ph">Breathe in</h1><div class="orb" id="ob" style="transition:transform 4s ease-in-out"></div><div class="big" id="cd">3:00</div><p class="m">In 4 &middot; hold 4 &middot; out 6. Urges rise, peak, and pass.</p><button class="b p" id="fin" onclick="sdone(${0})">I&rsquo;m okay, finish</button>`);
 logEv('urge','');window._st=Date.now();
 const o=()=>$('#ob'),ph=x=>$('#ph').textContent=x;
 requestAnimationFrame(()=>{o().style.transform='scale(1)'});
 tm=setInterval(()=>{t++;const p=t%14;
  if(p===0){o().style.transition='transform 4s ease-in-out';o().style.transform='scale(1)';ph('Breathe in')}
  if(p===4)ph('Hold');if(p===8){o().style.transition='transform 6s ease-in-out';o().style.transform='scale(.6)';ph('Breathe out')}
  const r=L-t;$('#cd').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(r<=0)sdone(1)},1000)}
function sdone(){clearInterval(tm);const el=Math.round((Date.now()-window._st)/1000);
 if(el>=30){logEv('surf','');ov(`<h1>You rode it out.</h1><p class="m">That&rsquo;s a real win, and it&rsquo;s counted.</p><button class="b p" onclick="closeOv()">Done</button>`)}else closeOv()}
function fr(){
 let n=10,sel='';
 const draw=()=>ov(`<p class="m">Site paused</p><h1>Take ten seconds. What&rsquo;s underneath this?</h1><div class="big" style="margin:18px 0" aria-live="polite">${n>0?n:'&#10003;'}</div>
 <div class="row" style="justify-content:center;margin-bottom:22px">${TR.map(t=>`<button class="chip" aria-pressed="${sel===t}" onclick="fs2('${t}')">${t}</button>`).join('')}</div>
 <div class="row" style="justify-content:center"><button class="b w" onclick="closeOv();surf()">Ride the urge</button><button class="b" onclick="closeOv()">Go back</button><button class="b" ${n>0||!sel?'disabled':''} onclick="logEv('continue','${sel}');closeOv()">Continue anyway</button></div><p class="m" style="font-size:14px">Continuing is logged without judgment.</p>`);
 window.fs2=t=>{if(!sel)logEv('urge',t);sel=t;draw()};
 draw();tm=setInterval(()=>{if(n>0){n--;draw()}},1000)}
let ver=0,pt=null,dacc=false;
const push=()=>{clearTimeout(pt);pt=setTimeout(async()=>{try{const r=await fetch('/api/vault',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({blob:JSON.stringify(S),version:ver})});if(r.ok)ver=(await r.json()).version;else if(r.status===409)pull();else if(r.status===401)location='/'}catch(e){}},800)};
async function pull(){try{const r=await fetch('/api/vault');if(r.status===401){location='/';return}const j=await r.json();ver=j.version;if(j.blob){S=Object.assign({days:{},ev:[],jn:[],focus:0},JSON.parse(j.blob))}else push();render()}catch(e){}}
async function out(){await fetch('/api/auth/logout',{method:'POST'});try{localStorage.removeItem(K)}catch(e){}location='/'}
async function delacct(){if(!dacc){dacc=true;const b=event.target;b.textContent='Tap again to erase account forever';return}await fetch('/api/account',{method:'DELETE'});try{localStorage.removeItem(K)}catch(e){}location='/'}
render();pull();
</script></body></html>
